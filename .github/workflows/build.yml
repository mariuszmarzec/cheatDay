name: build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Create keystore
      run: ./script/create_keystore.sh

    - name: Create local.properties
      run: ./script/create_local_properties.sh

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: oracle
        java-version: 21

    - name: Detekt
      run: ./gradlew detekt

    - name: Build with Gradle
      run: ./gradlew build

    - name: unit tests
      run: ./gradlew testStageDebugUnitTest

    - name: Upload artifact on ui tests failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Unit test report
        path: '**/app/build/reports/tests/**'

    - name: Check KVM
      id: check-kvm
      run: |
        if [ -e /dev/kvm ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Enable KVM
      if: steps.check-kvm.outputs.exists == 'true'
      run: |
        sudo mkdir -p /etc/udev/rules.d
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: UI tests
      if: steps.check-kvm.outputs.exists == 'true'
      uses: reactivecircus/android-emulator-runner@v2.33.0
      with:
        api-level: 31
        arch: x86_64
        profile: Nexus 6
        script: ./gradlew connectedStageDebugAndroidTest

    - name: Upload artifact on UI test failure
      if: failure() && steps.check-kvm.outputs.exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: UI Tests report
        path: '**/app/build/reports/androidTests/**'

    - name: Coverage report
      run: ./gradlew jacocoTestCoverageVerification

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: Jacoco report
        path: '**/app/build/reports/jacoco/**'

    - name: Log success message
      run: echo "Build finished successfully"
