name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # `build` stays on the self-hosted runner: compiling, detekt, unit tests and
  # coverage-data collection only need the JDK + Android SDK, not KVM, so they
  # work fine there. It also assembles the app + androidTest APKs and uploads
  # them as an artifact so the `ui-tests` job can consume them.
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Create keystore
      run: ./script/create_keystore.sh

    - name: Create local.properties
      run: ./script/create_local_properties.sh

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: oracle
        java-version: 21

    - name: Detekt
      run: ./gradlew detekt

    - name: Build with Gradle
      run: ./gradlew build

    - name: unit tests
      run: ./gradlew testStageDebugUnitTest

    # enableUnitTestCoverage (debug build type) makes testStageDebugUnitTest
    # write app/build/outputs/unit_test_code_coverage/**/*.exec — uploaded here
    # and consumed by the `jacoco-report` job.
    - name: Upload unit test coverage (.exec)
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-exec
        path: app/build/outputs/unit_test_code_coverage/**/*.exec
        if-no-files-found: error

    - name: Upload artifact on ui tests failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Unit test report
        path: '**/app/build/reports/tests/**'

    # The UI-test APKs are built here (on the self-hosted runner) but executed
    # in the `ui-tests` job on GitHub-hosted ubuntu-latest. Artifacts are the
    # bridge: upload-artifact publishes them here, download-artifact fetches
    # them in the other job, so no machine ever needs direct access to another.
    - name: Build Android test APK
      run: ./gradlew assembleStageDebugAndroidTest

    - name: Upload APKs for UI tests
      uses: actions/upload-artifact@v4
      with:
        name: apks
        path: |
          app/build/outputs/apk/stage/debug/app-stage-debug.apk
          app/build/outputs/apk/androidTest/stage/debug/app-stage-debug-androidTest.apk
        if-no-files-found: error

    - name: Log success message
      run: echo "Build finished successfully"

  # `ui-tests` runs on GitHub-hosted ubuntu-latest because those runners expose
  # /dev/kvm (hardware-accelerated emulation). Emulators without KVM are too
  # slow/unreliable for CI, so the KVM-dependent steps moved here; the self-
  # hosted runner keeps only the KVM-free build/unit-test/coverage steps.
  # `needs: build` guarantees the APK artifact exists before this job downloads
  # it, and the emulator boots the same APKs the `build` job produced.
  # Why it can look unused: the workflow triggers only on pull_request to
  # master (no push trigger), and `needs: build` starts this job only after
  # `build` finishes. So push-triggered runs never contain `ui-tests` at all,
  # and a PR run shows it only once `build` succeeds - if `build` fails, it
  # never appears.
  ui-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
    # Fetch the APKs uploaded by the `build` job (cross-runner transfer via
    # GitHub artifact storage).
    - name: Download APKs
      uses: actions/download-artifact@v4
      with:
        name: apks
        path: app/build/outputs/apk

    - name: UI tests
      uses: reactivecircus/android-emulator-runner@v2.33.0
      with:
        api-level: 31
        arch: x86_64
        profile: Nexus 6
        # google_apis image + more RAM: the default AOSP image crashed the
        # system process (INSTRUMENTATION_ABORTED: System has crashed) when
        # JaCoCo coverage instrumentation (-e coverage true) roughly doubles
        # the app process memory. The google_apis image is more stable under
        # that load.
        target: google_apis
        ram-size: 3072M
        heap-size: 512M
        script: |
          adb install -r app/build/outputs/apk/stage/debug/app-stage-debug.apk || exit 1
          adb install -r app/build/outputs/apk/androidTest/stage/debug/app-stage-debug-androidTest.apk || exit 1
          # The debug APK is JaCoCo-instrumented (enableAndroidTestCoverage in
          # app/build.gradle.kts); `-e coverage true` makes the instrumentation
          # write a coverage .ec file, which is pulled and uploaded for the
          # `jacoco-report` job.
          bash -o pipefail -c 'adb shell am instrument -w -r -e coverage true -e coverageFile /sdcard/Android/data/com.marzec.cheatday.debug/files/coverage.ec com.marzec.cheatday.debug.test/com.marzec.cheatday.MockTestRunner 2>&1 | tee ui-test.log'
          mkdir -p app/build/outputs/code_coverage/connected
          adb pull /sdcard/Android/data/com.marzec.cheatday.debug/files/coverage.ec app/build/outputs/code_coverage/connected/coverage.ec || exit 1

    - name: Upload artifact on UI test failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: UI Tests console log
        path: ui-test.log

    - name: Upload UI test coverage (.ec)
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-ec
        path: app/build/outputs/code_coverage/connected/coverage.ec
        if-no-files-found: error

  # `jacoco-report` runs after BOTH `build` (unit-test .exec) and `ui-tests`
  # (instrumented .ec) have finished, merges the two coverage data files and
  # produces the single Jacoco report + verification gate. It needs the JDK +
  # Android SDK (compileStageDebugKotlin) but not KVM, so it stays on the
  # self-hosted runner.
  jacoco-report:
    runs-on: self-hosted
    needs: [build, ui-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Create local.properties
      run: ./script/create_local_properties.sh

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: oracle
        java-version: 21

    # Artifacts are downloaded with their original relative paths, so the
    # coverage files land where jacoco.gradle.kts globs them (`**/*.exec`,
    # `**/*.ec` under the app dir).
    - name: Download unit test coverage (.exec)
      uses: actions/download-artifact@v4
      with:
        name: jacoco-exec
        path: .

    - name: Download UI test coverage (.ec)
      uses: actions/download-artifact@v4
      with:
        name: jacoco-ec
        path: .

    # jacocoTestReportStageDebug points its classDirectories at
    # build/tmp/kotlin-classes/stageDebug, so the classes must exist in this
    # job's fresh checkout before the report can be generated.
    - name: Compile app classes
      run: ./gradlew compileStageDebugKotlin

    - name: Coverage report
      run: ./gradlew jacocoTestCoverageVerification

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: Jacoco report
        path: '**/app/build/jacocoHtml/**'
